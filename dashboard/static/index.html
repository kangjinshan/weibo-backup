<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微博备份监控</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
:root {
  --md-primary: #1a73e8;
  --md-on-primary: #fff;
  --md-surface: #fff;
  --md-background: #f8f9fa;
  --md-on-surface: #202124;
  --md-on-surface-variant: #5f6368;
  --md-outline: #dadce0;
  --md-error: #d93025;
  --md-success: #1e8e3e;
  --md-warning: #f9ab00;
  --md-elevation-1: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --md-elevation-2: 0 1px 2px 0 rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  --md-shape: 8px;
  --md-shape-lg: 12px;
  --md-shape-xl: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Google Sans', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--md-background);
  color: var(--md-on-surface);
  min-height: 100vh;
}
[hidden] { display: none !important; }

/* Auth Gate */
.auth-gate {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #f8f9fa;
}
.auth-dialog {
  width: min(420px, 100%);
  background: var(--md-surface);
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-lg);
  box-shadow: var(--md-elevation-2);
  padding: 24px;
}
.auth-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.auth-title .material-icons-outlined {
  color: var(--md-primary);
  font-size: 26px;
}
.auth-title h1 {
  font-size: 22px;
  font-weight: 500;
}
.auth-form {
  display: grid;
  gap: 14px;
}
.auth-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

/* Top App Bar */
.top-bar {
  background: var(--md-surface);
  border-bottom: 1px solid var(--md-outline);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar h1 {
  font-size: 22px;
  font-weight: 500;
  color: var(--md-on-surface);
}
.top-bar .material-icons-outlined { font-size: 24px; color: var(--md-primary); }
.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.icon-button {
  width: 40px;
  height: 40px;
  border: 1px solid var(--md-outline);
  border-radius: 50%;
  background: var(--md-surface);
  color: var(--md-on-surface-variant);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.icon-button:hover {
  background: #f1f3f4;
  border-color: #cfd4dc;
  color: var(--md-primary);
}
.icon-button .material-icons-outlined {
  font-size: 20px;
  color: currentColor;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
}
.status-chip.running { background: #e8f5e9; color: var(--md-success); }
.status-chip.stopped { background: #fce8e6; color: var(--md-error); }
.status-chip.paused { background: #e8f0fe; color: var(--md-primary); }
.status-chip.completed { background: #e6f4ea; color: var(--md-success); }
.status-chip.global_waiting { background: #fef7e0; color: #e37400; }
.status-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
}
.status-chip.running .dot { animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Layout */
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* Stats Cards */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--md-surface);
  border-radius: var(--md-shape-lg);
  padding: 20px;
  box-shadow: var(--md-elevation-1);
}
.stat-card .icon-circle {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.stat-card .icon-circle .material-icons-outlined { font-size: 20px; color: #fff; }
.stat-card .icon-circle.blue { background: var(--md-primary); }
.stat-card .icon-circle.green { background: var(--md-success); }
.stat-card .icon-circle.orange { background: var(--md-warning); }
.stat-card .icon-circle.red { background: var(--md-error); }
.stat-card .value { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stat-card .label { font-size: 13px; color: var(--md-on-surface-variant); margin-top: 4px; }

/* Progress Section */
.progress-section {
  background: var(--md-surface);
  border-radius: var(--md-shape-lg);
  padding: 20px;
  box-shadow: var(--md-elevation-1);
  margin-bottom: 20px;
}
.progress-section h2 {
  font-size: 16px; font-weight: 500; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.progress-bar-track {
  height: 8px;
  background: #e8eaed;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: var(--md-primary);
  border-radius: 4px;
  transition: width 0.6s ease;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--md-on-surface-variant);
}

/* Calendar */
.calendar-section {
  background: var(--md-surface);
  border: 1px solid #edf0f2;
  border-radius: var(--md-shape-lg);
  padding: 18px;
  box-shadow: 0 8px 24px rgba(60,64,67,.06);
  margin-bottom: 20px;
}
.calendar-section h2 {
  font-size: 15px; font-weight: 500; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
  color: #2f3337;
}
.calendar-section h2 .material-icons-outlined {
  color: #6f7b8a;
  font-size: 20px;
}
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 470px;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 14px;
  padding: 4px 2px 12px;
  border-bottom: 1px solid #f1f3f4;
}
.cal-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.cal-header button {
  background: #fff;
  border: 1px solid transparent;
  cursor: pointer;
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #6f7b8a;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.cal-header button:hover {
  background: #f8fafb;
  border-color: #e4e7eb;
  color: #202124;
}
.cal-header button .material-icons-outlined { font-size: 21px; }
.cal-header button.year-jump .material-icons-outlined { font-size: 19px; }
.cal-header button.boundary-jump .material-icons-outlined { font-size: 20px; }
.cal-header .month-label {
  font-size: 17px;
  font-weight: 500;
  color: #202124;
  min-width: 92px;
  text-align: center;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 46px);
  justify-content: center;
  gap: 8px 12px;
  width: fit-content;
  margin: 0 auto;
  text-align: center;
}
.cal-grid .day-name {
  font-size: 11px;
  color: #8a929c;
  padding: 4px 0 6px;
  font-weight: 500;
  letter-spacing: 0;
}
.cal-grid .day-cell {
  position: relative;
  width: 44px;
  height: 44px;
  padding: 7px 4px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  justify-self: center;
  color: #3c4043;
}
.cal-grid .day-cell:hover {
  background: #f7f9fb;
  border-color: #e8eaed;
}
.cal-grid .day-cell.has-posts {
  background: #f8fbff;
  border-color: #e7f0ff;
  color: #174ea6;
  font-weight: 500;
}
.cal-grid .day-cell.has-posts:hover {
  background: #eef5ff;
  border-color: #d7e7ff;
  transform: translateY(-1px);
}
.cal-grid .day-cell.selected {
  background: #1a73e8;
  border-color: #1a73e8;
  color: #fff;
  box-shadow: 0 6px 14px rgba(26,115,232,.22);
}
.cal-grid .day-cell.today {
  border-color: #b8d4fb;
  color: #1a73e8;
}
.cal-grid .day-cell.today.selected {
  border-color: #1a73e8;
  color: #fff;
}
.cal-grid .day-cell .post-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #1a73e8;
  position: absolute;
  bottom: 6px;
}
.cal-grid .day-cell.selected .post-dot { background: #fff; }
.cal-grid .day-cell.empty {
  cursor: default;
  width: 44px;
  height: 44px;
}
.cal-grid .day-cell.empty:hover { background: transparent; }

/* Weibo Feed */
.feed-section { margin-bottom: 20px; }
.feed-section h2 {
  font-size: 16px; font-weight: 500; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.feed-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.filter-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.filter-label {
  font-size: 13px;
  color: var(--md-on-surface-variant);
}
.segmented-control {
  display: inline-flex;
  align-items: center;
  padding: 2px;
  border: 1px solid var(--md-outline);
  border-radius: 8px;
  background: var(--md-surface);
}
.segmented-control button {
  min-height: 32px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--md-on-surface-variant);
  padding: 6px 10px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.segmented-control button:hover {
  background: #f1f3f4;
  color: var(--md-on-surface);
}
.segmented-control button.active {
  background: #e8f0fe;
  color: var(--md-primary);
  font-weight: 500;
}
.weibo-card {
  background: var(--md-surface);
  border-radius: var(--md-shape-lg);
  padding: 20px;
  box-shadow: var(--md-elevation-1);
  margin-bottom: 12px;
  transition: box-shadow 0.2s;
}
.weibo-card:hover { box-shadow: var(--md-elevation-2); }
.weibo-card .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--md-on-surface-variant);
}
.weibo-card .meta .badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.meta-link,
.inline-link,
.action-link {
  color: var(--md-primary);
  text-decoration: none;
}
.meta-link:hover,
.inline-link:hover,
.action-link:hover {
  text-decoration: underline;
}
.badge-original { background: #e8f0fe; color: var(--md-primary); }
.badge-repost { background: #fef7e0; color: #e37400; }
.weibo-card .content {
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.weibo-card .content .label {
  color: var(--md-on-surface-variant);
  font-size: 13px;
}
.weibo-card .media-grid {
  display: grid;
  gap: 4px;
  margin-top: 12px;
  border-radius: var(--md-shape);
  overflow: hidden;
  max-width: min(100%, 720px);
  align-items: start;
}
.media-grid.cols-1 { grid-template-columns: 1fr; max-width: min(100%, 680px); }
.media-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: min(100%, 560px); }
.media-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: min(100%, 660px); }
.media-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: min(100%, 560px); }
.media-grid.cols-5, .media-grid.cols-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: min(100%, 660px); }
.weibo-card .media-grid img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: min(60vh, 520px);
  object-fit: contain;
  background: #f8f9fa;
  border-radius: var(--md-shape);
  cursor: pointer;
  transition: opacity 0.2s;
}
.weibo-card .media-grid:not(.cols-1) img {
  width: 100%;
  height: clamp(128px, 20vw, 220px);
}
.weibo-card .media-grid img:hover { opacity: 0.85; }
.weibo-card .media-grid .video-thumb {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--md-shape);
  overflow: hidden;
}
.video-thumb .play-icon {
  color: #fff;
  font-size: 48px;
  opacity: 0.8;
}
.weibo-card video {
  width: 100%;
  max-height: 520px;
  background: #000;
  border-radius: var(--md-shape);
  display: block;
}
.video-unavailable {
  aspect-ratio: 16/9;
  background: #f1f3f4;
  color: var(--md-on-surface-variant);
  border-radius: var(--md-shape);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.weibo-card .actions {
  display: flex;
  gap: 24px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--md-outline);
}
.weibo-card .action-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--md-on-surface-variant);
}
.weibo-card .actions a.action-item {
  cursor: pointer;
  color: var(--md-primary);
}
.action-item .material-icons-outlined { font-size: 18px; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
}
.pagination button {
  background: var(--md-surface);
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape);
  padding: 8px 16px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  transition: background 0.15s;
}
.pagination button:hover { background: #f1f3f4; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination .page-info { font-size: 14px; color: var(--md-on-surface-variant); }

/* Image Lightbox */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.lightbox.active { display: flex; }
.lightbox-viewport {
  position: absolute;
  inset: 0;
  padding: 72px 24px 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: grab;
}
.lightbox-viewport.dragging { cursor: grabbing; }
.lightbox img {
  width: auto;
  height: auto;
  max-width: min(92vw, 1400px);
  max-height: min(86vh, 1000px);
  object-fit: contain;
  border-radius: 8px;
  transform-origin: center center;
  transition: transform 0.12s ease;
  user-select: none;
  will-change: transform;
}
.lightbox-viewport.dragging img { transition: none; }
.lightbox-toolbar {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 1001;
  display: flex;
  gap: 8px;
  padding: 6px;
  border-radius: 999px;
  background: rgba(32,33,36,.72);
  backdrop-filter: blur(8px);
}
.lightbox-toolbar button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  color: #fff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.lightbox-toolbar button:hover { background: rgba(255,255,255,.22); }
.lightbox-toolbar .material-icons-outlined {
  font-size: 20px;
  color: currentColor;
}

/* Backup Settings */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(32,33,36,.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.active { display: flex; }
.settings-dialog {
  width: min(640px, 100%);
  max-height: min(720px, 92vh);
  overflow: auto;
  background: var(--md-surface);
  border-radius: var(--md-shape-lg);
  box-shadow: 0 20px 50px rgba(32,33,36,.28);
}
.settings-header {
  position: sticky;
  top: 0;
  background: var(--md-surface);
  border-bottom: 1px solid var(--md-outline);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.settings-header h2 {
  font-size: 18px;
  font-weight: 500;
}
.settings-body {
  padding: 18px;
  display: grid;
  gap: 16px;
}
.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.field {
  display: grid;
  gap: 6px;
}
.field.full { grid-column: 1 / -1; }
.field label,
.toggle-row label {
  font-size: 13px;
  color: var(--md-on-surface-variant);
}
.field input,
.field textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape);
  padding: 9px 12px;
  font: inherit;
  color: var(--md-on-surface);
  background: #fff;
}
.field textarea {
  min-height: 88px;
  resize: vertical;
}
.field input:focus,
.field textarea:focus {
  border-color: var(--md-primary);
  outline: none;
  box-shadow: 0 0 0 2px rgba(26,115,232,.16);
}
.toggle-row {
  min-height: 42px;
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.toggle-row input {
  width: 20px;
  height: 20px;
  accent-color: var(--md-primary);
}
.settings-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.action-button {
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape);
  background: #fff;
  color: var(--md-on-surface);
  min-height: 40px;
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.action-button.primary {
  background: var(--md-primary);
  border-color: var(--md-primary);
  color: var(--md-on-primary);
}
.action-button.danger {
  color: var(--md-error);
  border-color: #f5c2bd;
}
.action-button:hover { background: #f8f9fa; }
.action-button.primary:hover { background: #1765cc; }
.action-button .material-icons-outlined {
  color: currentColor;
  font-size: 18px;
}
.settings-feedback {
  min-height: 20px;
  font-size: 13px;
  color: var(--md-on-surface-variant);
}
.settings-feedback.success { color: var(--md-success); }
.settings-feedback.error { color: var(--md-error); }

/* Date filter display */
.date-filter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: #e8f0fe;
  color: var(--md-primary);
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
  margin-left: 12px;
  cursor: pointer;
}
.date-filter:hover { background: #d2e3fc; }
.date-filter .material-icons-outlined { font-size: 16px; }

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--md-on-surface-variant);
}
.loading .material-icons-outlined {
  font-size: 40px;
  animation: spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .container { padding: 12px; }
  .top-bar { padding: 12px 16px; }
  .top-bar h1 { font-size: 18px; }
  .top-actions { gap: 8px; }
  .settings-grid { grid-template-columns: 1fr; }
  .feed-toolbar { align-items: stretch; }
  .filter-group { width: 100%; align-items: flex-start; flex-direction: column; }
  .segmented-control {

<script>
const API = '';
let currentDate = new Date();
let selectedDate = null;
let currentPage = 1;
let currentTotalPages = 0;
let currentTotalItems = 0;
let postTypeFilter = 'all';
let mediaTypeFilter = 'all';
let dateCounts = {};
let autoRefreshTimer = null;
let isLoadingWeibo = false;
let lightboxScale = 1;
let lightboxX = 0;
let lightboxY = 0;
let lightboxDragging = false;
let lightboxDragStart = { x: 0, y: 0 };
let authConfigured = false;
let dashboardStarted = false;

function currentMonthKey() {
  const year = currentDate.getFullYear();
  const month = String(currentDate.getMonth() + 1).padStart(2, '0');
  return `${year}-${month}`;
}

function monthKeysWithPosts() {
  return [...new Set(Object.keys(dateCounts).map(date => date.slice(0, 7)))].sort();
}

function findAdjacentMonth(delta) {
  const current = currentMonthKey();
  const months = monthKeysWithPosts();
  if (delta > 0) {
    return months.find(month => month > current) || null;
  }
  return months.filter(month => month < current).pop() || null;
}

function hasAdjacentMonth(delta) {
  return Boolean(findAdjacentMonth(delta));
}

function setMonthFromKey(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  currentDate = new Date(year, month - 1, 1);
}

// --- API ---
async function fetchJSON(url) {
  try {
    const r = await fetch(API + url);
    return await parseJSONResponse(r);
  } catch (err) {
    handleAuthError(err);
    throw err;
  }
}

async function postJSON(url, payload = {}) {
  try {
    const r = await fetch(API + url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    return await parseJSONResponse(r);
  } catch (err) {
    handleAuthError(err);
    throw err;
  }
}

function handleAuthError(err) {
  if (err.status === 401 && err.payload?.auth_required) {
    showAuthGate(err.payload.configured);
  }
}

async function parseJSONResponse(response) {
  const text = await response.text();
  let payload;
  try {
    payload = text ? JSON.parse(text) : {};
  } catch (_) {
    const message = text.trim() || `HTTP ${response.status}`;
    throw new Error(message);
  }
  if (!response.ok) {
    const message = payload.message || payload.detail || `HTTP ${response.status}`;
    const error = new Error(message);
    error.status = response.status;
    error.payload = payload;
    throw error;
  }
  return payload;
}

function setAuthFeedback(message, type = '') {
  const el = document.getElementById('authFeedback');
  el.className = `settings-feedback ${type}`;
  el.textContent = message;
}

function showAuthGate(configured) {
  authConfigured = Boolean(configured);
  document.getElementById('appShell').hidden = true;
  document.getElementById('authGate').hidden = false;
  document.getElementById('authConfirmField').hidden = authConfigured;
  document.getElementById('authPasswordLabel').textContent = authConfigured ? '访问密码' : '设置访问密码';
  document.getElementById('authSubmitButton').innerHTML = authConfigured
    ? '<span class="material-icons-outlined">login</span>登录'
    : '<span class="material-icons-outlined">lock_reset</span>设置密码';
  document.getElementById('authPassword').autocomplete = authConfigured ? 'current-password' : 'new-password';
  setAuthFeedback(authConfigured ? '请输入访问密码' : '首次访问需要设置一个访问密码');
  setTimeout(() => document.getElementById('authPassword').focus(), 0);
}

function showDashboard() {
  document.getElementById('authGate').hidden = true;
  document.getElementById('appShell').hidden = false;
  setAuthFeedback('');
  if (!dashboardStarted) {
    dashboardStarted = true;
    init();
  } else {
    refreshAll();
  }
}

async function loadAuthStatus() {
  try {
    const status = await fetchJSON('/api/auth/status');
    if (status.authenticated) {
      showDashboard();
    } else {
      showAuthGate(status.configured);
    }
  } catch (err) {
    showAuthGate(true);
    setAuthFeedback(`认证状态读取失败：${err.message}`, 'error');
  }
}

async function submitAuth() {
  const password = document.getElementById('authPassword').value;
  const confirm = document.getElementById('authPasswordConfirm').value;
  if (!authConfigured && password !== confirm) {
    setAuthFeedback('两次输入的密码不一致', 'error');
    return;
  }

  setAuthFeedback(authConfigured ? '登录中...' : '设置中...');
  try {
    await postJSON(authConfigured ? '/api/auth/login' : '/api/auth/setup', { password });
    document.getElementById('authPassword').value = '';
    document.getElementById('authPasswordConfirm').value = '';
    showDashboard();
  } catch (err) {
    setAuthFeedback(err.message, 'error');
  }
}

async function logoutDashboard() {
  try {
    await postJSON('/api/auth/logout');
  } finally {
    if (autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = null;
    }
    dashboardStarted = false;
    showAuthGate(true);
  }
}

// --- Stats & Status ---
async function refreshStats() {
  const [stats, status] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/spider-status'),
  ]);

  document.getElementById('weiboCount').textContent = stats.weibo_count;
  document.getElementById('imgCount').textContent = stats.img_count;
  document.getElementById('videoCount').textContent = stats.video_count;
  document.getElementById('totalSize').textContent = stats.total_size_mb;

  // Status
  const chip = document.getElementById('statusChip');
  const text = document.getElementById('statusText');
  chip.className = 'status-chip ' + (status.status || 'stopped');
  const labels = { running: '备份中', paused: '已暂停', completed: '已完成', stopped: '已停止', global_waiting: '全局等待中' };
  text.textContent = labels[status.status] || status.status;

  // Progress
  const total = status.total_pages || 0;
  const current = status.current_page || 0;
  const pct = total > 0 ? Math.round(current / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  const progressText = total > 0
    ? `第 ${current} / ${total} 页`
    : (status.status === 'running' || status.status === 'paused' || status.status === 'global_waiting' ? '等待爬虫日志' : '未运行');
  document.getElementById('progressText').textContent = progressText;
  document.getElementById('progressPercent').textContent = pct + '%';
}

// --- Calendar ---
function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = `${year}年${month + 1}月`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  dayNames.forEach(d => {
    const el = document.createElement('div');
    el.className = 'day-name';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'day-cell';
    el.textContent = d;

    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const count = dateCounts[dateStr] || 0;

    if (count > 0) {
      el.classList.add('has-posts');
      el.title = `${dateStr} · ${count} 条微博`;
      const dot = document.createElement('span');
      dot.className = 'post-dot';
      el.appendChild(dot);
    }

    if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d) {
      el.classList.add('today');
    }

    if (selectedDate === dateStr) {
      el.classList.add('selected');
    }

    if (count > 0) {
      el.addEventListener('click', () => selectDate(dateStr));
    }

    grid.appendChild(el);
  }
}

function changeMonth(delta) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
  selectedDate = null;
  currentPage = 1;
  document.getElementById('dateFilter').style.display = 'none';
  renderCalendar();
  loadWeibo();
}

function changeYear(delta) {
  currentDate = new Date(currentDate.getFullYear() + delta, currentDate.getMonth(), 1);
  selectedDate = null;
  currentPage = 1;
  document.getElementById('dateFilter').style.display = 'none';
  renderCalendar();
  loadWeibo();
}

function jumpToDateBoundary(boundary) {
  const dates = Object.keys(dateCounts).sort();
  if (!dates.length) return;
  const target = boundary === 'last' ? dates[dates.length - 1] : dates[0];
  const [year, month] = target.split('-').map(Number);
  currentDate = new Date(year, month - 1, 1);
  selectDate(target);
}

async function loadDates() {
  const data = await fetchJSON('/api/dates');
  dateCounts = data.dates || {};
  const firstDate = Object.keys(dateCounts).sort()[0];
  if (firstDate) {
    const [year, month] = firstDate.split('-').map(Number);
    currentDate = new Date(year, month - 1, 1);
  }
  renderCalendar();
}

function selectDate(dateStr) {
  if (selectedDate === dateStr) {
    clearDateFilter();
    return;
  }
  selectedDate = dateStr;
  currentPage = 1;
  document.getElementById('dateFilter').style.display = 'inline-flex';
  document.getElementById('dateFilterText').textContent = dateStr;
  renderCalendar();
  loadWeibo();
}

function clearDateFilter() {
  selectedDate = null;
  currentPage = 1;
  document.getElementById('dateFilter').style.display = 'none';
  renderCalendar();
  loadWeibo();
}

function setActiveSegment(groupId, value) {
  document.querySelectorAll(`#${groupId} button`).forEach(button => {
    button.classList.toggle('active', button.dataset.value === value);
  });
}

function applyFeedFilters() {
  currentPage = 1;
  setActiveSegment('postTypeFilter', postTypeFilter);
  setActiveSegment('mediaTypeFilter', mediaTypeFilter);
  loadWeibo({ scrollToFeed: true });
}

function setPostTypeFilter(value) {
  postTypeFilter = value;
  applyFeedFilters();
}

function setMediaTypeFilter(value) {
  mediaTypeFilter = value;
  applyFeedFilters();
}

async function jumpToAdjacentMonth(delta, targetEdge = 'first') {
  const target = findAdjacentMonth(delta);
  if (!target) return;
  setMonthFromKey(target);
  selectedDate = null;
  currentPage = targetEdge === 'last' ? Number.MAX_SAFE_INTEGER : 1;
  document.getElementById('dateFilter').style.display = 'none';
  renderCalendar();
  await loadWeibo({ scrollToFeed: true });
}

// --- Weibo Feed ---
function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function weiboProfileUrl(name) {
  return `https://weibo.com/n/${encodeURIComponent(name)}`;
}

function weiboDetailUrl(weibo) {
  const ownerId = weibo.owner_user_id || weibo.user_id || '';
  if (!ownerId || !weibo.id) return '';
  return `https://weibo.com/${ownerId}/${encodeURIComponent(weibo.id || '')}`;
}

function formatContent(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  const linkedUrls = [];
  html = html.replace(/(https?:\/\/\S+)/g, url => {
    const index = linkedUrls.length;
    linkedUrls.push(`<a class="inline-link" href="${url}" target="_blank" rel="noopener">${url}</a>`);
    return `__URL_PLACEHOLDER_${index}__`;
  });
  // Highlight hashtags
  html = html.replace(/#([^#]+)#/g, '<span style="color:var(--md-primary)">#$1#</span>');
  html = html.replace(
    /(^|[^A-Za-z0-9_\u4e00-\u9fa5])@([\u4e00-\u9fa5A-Za-z0-9_.\-·]+)/g,
    (match, prefix, name) => `${prefix}<a class="inline-link" href="${weiboProfileUrl(name)}" target="_blank" rel="noopener">@${name}</a>`
  );
  linkedUrls.forEach((link, index) => {
    html = html.replace(`__URL_PLACEHOLDER_${index}__`, link);
  });
  return html;
}

function parseContent(text) {
  if (!text) return { type: 'original', content: '', repostUser: '', repostContent: '' };

  const repostMatch = text.match(/^转发理由:(.*?)\s+原始用户:\s*(\S+)\s+转发内容:\s*([\s\S]*)$/);
  if (repostMatch) {
    return {
      type: 'repost',
      content: repostMatch[1].trim(),
      repostUser: repostMatch[2],
      repostContent: repostMatch[3].trim(),
    };
  }

  // Handle "转发理由:" only
  const simpleRepost = text.match(/^转发理由:(.*?)$/s);
  if (simpleRepost) {
    return { type: 'repost', content: simpleRepost[1].trim(), repostUser: '', repostContent: '' };
  }

  return { type: 'original', content: text.trim(), repostUser: '', repostContent: '' };
}

function getMediaImages(weibo) {
  const imgs = [];
  const original = weibo.local_original_pictures_list?.length
    ? weibo.local_original_pictures_list
    : weibo.original_pictures_list;
  const retweet = weibo.local_retweet_pictures_list?.length
    ? weibo.local_retweet_pictures_list
    : weibo.retweet_pictures_list;

  (original || []).forEach(url => imgs.push(formatImageUrl(url)));
  (retweet || []).forEach(url => imgs.push(formatImageUrl(url)));
  return imgs;
}

function formatImageUrl(url) {
  if (!url) return '';
  if (url.startsWith('/media/')) return url;
  return url.replace('/large/', '/mw1024/');
}

function getLightboxUrl(url) {
  if (!url) return '';
  if (url.startsWith('/media/')) return url;
  return url.replace('/mw1024/', '/large/');
}

function renderWeiboCard(weibo) {
  const parsed = parseContent(weibo.content);
  const images = getMediaImages(weibo);
  const hasVideo = weibo.video_url && weibo.video_url !== '无';
  const detailUrl = weiboDetailUrl(weibo);

  let html = '<div class="weibo-card">';
  html += '<div class="meta">';
  if (detailUrl) {
    html += `<a class="meta-link" href="${detailUrl}" target="_blank" rel="noopener" title="打开原文">${escapeHtml(weibo.publish_time || '')}</a>`;
  } else {
    html += `<span>${escapeHtml(weibo.publish_time || '')}</span>`;
  }
  if (weibo.publish_tool && weibo.publish_tool !== '无') {
    html += `<span>· ${escapeHtml(weibo.publish_tool)}</span>`;
  }
  html += parsed.type === 'repost'
    ? '<span class="badge badge-repost">转发</span>'
    : '<span class="badge badge-original">原创</span>';
  if (weibo.publish_place && weibo.publish_place !== '无') {
    html += `<span>· 📍 ${escapeHtml(weibo.publish_place)}</span>`;
  }
  html += '</div>';

  // Content
  if (parsed.type === 'repost' && parsed.content) {
    html += `<div class="content">${formatContent(parsed.content)}</div>`;
  } else if (parsed.type === 'original') {
    html += `<div class="content">${formatContent(parsed.content)}</div>`;
  }

  // Images
  if (images.length > 0) {
    const colClass = `cols-${Math.min(images.length, 6)}`;
    html += `<div class="media-grid ${colClass}">`;
    images.forEach((url, i) => {
      html += `<img src="${escapeHtml(url)}" data-full-src="${escapeHtml(getLightboxUrl(url))}" loading="lazy" onclick="openLightbox(this.dataset.fullSrc)" onerror="this.style.display='none'">`;
    });
    html += '</div>';
  }

  // Video
  if (hasVideo) {
    const videoSrc = weibo.local_video_url || weibo.video_url;
    if (videoSrc) {
      html += '<div class="media-grid cols-1">';
      html += `<video controls preload="metadata" src="${videoSrc}"></video>`;
      html += '</div>';
    } else {
      html += '<div class="media-grid cols-1"><div class="video-unavailable">视频未下载</div></div>';
    }
  }

  // Retweet content
  if (parsed.type === 'repost' && parsed.repostContent) {
    html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;border-left:3px solid var(--md-outline)">';
    if (parsed.repostUser) {
      html += `<div style="font-size:13px;margin-bottom:4px"><a class="inline-link" href="${weiboProfileUrl(parsed.repostUser)}" target="_blank" rel="noopener">@${escapeHtml(parsed.repostUser)}</a></div>`;
    }
    html += `<div class="content" style="font-size:14px;color:var(--md-on-surface-variant)">${formatContent(parsed.repostContent)}</div>`;
    html += '</div>';
  }

  // Actions
  html += '<div class="actions">';
  html += `<div class="action-item"><span class="material-icons-outlined">thumb_up</span>${weibo.up_num || 0}</div>`;
  html += `<div class="action-item"><span class="material-icons-outlined">repeat</span>${weibo.retweet_num || 0}</div>`;
  html += `<div class="action-item"><span class="material-icons-outlined">chat_bubble_outline</span>${weibo.comment_num || 0}</div>`;
  if (detailUrl) {
    html += `<a class="action-item action-link" href="${detailUrl}" target="_blank" rel="noopener" title="打开原文"><span class="material-icons-outlined">open_in_new</span>打开原文</a>`;
  }
  html += '</div>';

  html += '</div>';
  return html;
}

async function loadWeibo(options = {}) {
  if (isLoadingWeibo) return;
  isLoadingWeibo = true;
  const feed = document.getElementById('weiboFeed');
  feed.innerHTML = '<div class="loading"><span class="material-icons-outlined">sync</span><br>加载中...</div>';

  try {
    let url = `/api/weibo?page=${currentPage}&per_page=20`;
    const dateFilter = selectedDate || currentMonthKey();
    if (dateFilter) url += `&date=${dateFilter}`;
    url += `&post_type=${encodeURIComponent(postTypeFilter)}&media_type=${encodeURIComponent(mediaTypeFilter)}`;

    const data = await fetchJSON(url);
    const total = data.total || 0;
    const totalPages = Math.max(0, Math.ceil(total / 20));

    if (totalPages > 0 && currentPage > totalPages) {
      currentPage = totalPages;
      isLoadingWeibo = false;
      await loadWeibo(options);
      return;
    }

    const weibos = data.weibo || [];
    currentTotalItems = total;
    currentTotalPages = totalPages;

    if (weibos.length === 0) {
      feed.innerHTML = '<div style="text-align:center;padding:40px;color:var(--md-on-surface-variant)">暂无微博数据</div>';
    } else {
      feed.innerHTML = weibos.map(renderWeiboCard).join('');
    }

    renderPagination();

    if (options.scrollToFeed) {
      window.scrollTo({ top: document.querySelector('.feed-section').offsetTop - 80, behavior: 'smooth' });
    }
  } finally {
    isLoadingWeibo = false;
  }
}

function renderPagination() {
  const pag = document.getElementById('pagination');
  const hasPrevPage = currentPage > 1;
  const hasNextPage = currentTotalPages > 0 && currentPage < currentTotalPages;
  const hasPrevMonth = !selectedDate && hasAdjacentMonth(-1);
  const hasNextMonth = !selectedDate && hasAdjacentMonth(1);
  const canGoPrev = hasPrevPage || hasPrevMonth;
  const canGoNext = hasNextPage || hasNextMonth;

  if (currentTotalPages <= 1 && !canGoPrev && !canGoNext) {
    pag.innerHTML = '';
    return;
  }

  const prevLabel = hasPrevPage ? '上一页' : '上个月';
  const nextLabel = hasNextPage ? '下一页' : '下个月';
  const pageText = currentTotalPages > 0
    ? `${currentPage} / ${currentTotalPages} 页 (共${currentTotalItems}条)`
    : `本月暂无微博`;
  let pagHtml = `<button onclick="navigatePage(-1)" ${canGoPrev ? '' : 'disabled'}>${prevLabel}</button>`;
  pagHtml += `<span class="page-info">${pageText}</span>`;
  pagHtml += `<button onclick="navigatePage(1)" ${canGoNext ? '' : 'disabled'}>${nextLabel}</button>`;
  pag.innerHTML = pagHtml;
}

async function navigatePage(delta) {
  if (isLoadingWeibo) return;
  const nextPage = currentPage + delta;
  if (currentTotalPages > 0 && nextPage >= 1 && nextPage <= currentTotalPages) {
    currentPage = nextPage;
    await loadWeibo({ scrollToFeed: true });
    return;
  }
  if (selectedDate) return;
  if (delta < 0 && nextPage < 1) {
    await jumpToAdjacentMonth(-1, 'last');
  } else if (delta > 0 && nextPage > currentTotalPages) {
    await jumpToAdjacentMonth(1, 'first');
  }
}

function goPage(p) {
  const delta = p - currentPage;
  if (delta) navigatePage(delta);
}

// --- Backup Settings ---
function showBackupFeedback(message, type = '') {
  const el = document.getElementById('backupFeedback');
  el.className = `settings-feedback ${type}`;
  el.textContent = message;
}

function fillBackupConfig(config) {
  document.getElementById('configUserIds').value = (config.user_id_list || []).join(', ');
  document.getElementById('configCookieStatus').value = config.cookie_configured ? '已配置' : '未配置或仍是示例值';
  document.getElementById('configCookieInput').value = '';
  document.getElementById('configSinceDate').value = config.since_date || '';
  document.getElementById('configEndDate').value = config.end_date || 'now';
  document.getElementById('configPicDownload').checked = Boolean(config.pic_download);
  document.getElementById('configVideoDownload').checked = Boolean(config.video_download);
  document.getElementById('configWriteMode').value = (config.write_mode || []).join(', ');
}

function collectBackupConfig() {
  const payload = {
    user_id_list: document.getElementById('configUserIds').value,
    since_date: document.getElementById('configSinceDate').value,
    end_date: document.getElementById('configEndDate').value,
    pic_download: document.getElementById('configPicDownload').checked,
    video_download: document.getElementById('configVideoDownload').checked,
  };
  const cookie = document.getElementById('configCookieInput').value.trim();
  if (cookie) payload.cookie = cookie;
  return payload;
}

async function loadBackupConfig() {
  showBackupFeedback('读取配置中...');
  try {
    const config = await fetchJSON('/api/backup-config');
    fillBackupConfig(config);
    const statusText = config.status?.status === 'paused'
      ? '当前状态：已暂停'
      : config.status?.running
        ? '当前状态：备份中'
        : '当前状态：已停止';
    const issues = config.config_issues || [];
    showBackupFeedback(issues.length ? issues.join('；') : statusText, issues.length ? 'error' : '');
  } catch (err) {
    showBackupFeedback(`读取失败：${err.message}`, 'error');
  }
}

function openBackupModal() {
  document.getElementById('backupModal').classList.add('active');
  loadBackupConfig();
}

function closeBackupModal() {
  document.getElementById('backupModal').classList.remove('active');
}

async function saveBackupConfig(options = {}) {
  if (!options.silent) showBackupFeedback('保存配置中...');
  try {
    const result = await postJSON('/api/backup-config', collectBackupConfig());
    if (!result.ok) {
      showBackupFeedback(result.message || '保存失败', 'error');
      return false;
    }
    document.getElementById('configCookieInput').value = '';
    document.getElementById('configCookieStatus').value = result.cookie_configured ? '已配置' : '未配置或仍是示例值';
    if (!options.silent) {
      const issues = result.config_issues || [];
      showBackupFeedback(issues.length ? `配置已保存；${issues.join('；')}` : '配置已保存', issues.length ? 'error' : 'success');
    }
    return true;
  } catch (err) {
    showBackupFeedback(`保存失败：${err.message}`, 'error');
    return false;
  }
}

async function backupAction(action) {
  const actionLabels = { start: '启动', pause: '暂停', resume: '继续', stop: '停止' };
  showBackupFeedback(`${actionLabels[action]}中...`);
  try {
    const result = await postJSON(`/api/backup/${action}`);
    if (!result.ok) {
      showBackupFeedback(result.message || `${actionLabels[action]}失败`, 'error');
      return;
    }
    showBackupFeedback(`${actionLabels[action]}指令已发送`, 'success');
    await refreshProgressOnly();
  } catch (err) {
    showBackupFeedback(`${actionLabels[action]}失败：${err.message}`, 'error');
  }
}

async function startBackupFromModal() {
  showBackupFeedback('保存配置中...');
  const saved = await saveBackupConfig({ silent: true });
  if (!saved) return;
  await backupAction('start');
}

// --- Lightbox ---
function applyLightboxTransform() {
  const img = document.getElementById('lightboxImg');
  img.style.transform = `translate(${lightboxX}px, ${lightboxY}px) scale(${lightboxScale})`;
}

function zoomLightbox(delta) {
  lightboxScale = Math.min(5, Math.max(0.5, lightboxScale + delta));
  if (lightboxScale === 1) {
    lightboxX = 0;
    lightboxY = 0;
  }
  applyLightboxTransform();
}

function resetLightboxZoom() {
  lightboxScale = 1;
  lightboxX = 0;
  lightboxY = 0;
  applyLightboxTransform();
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  resetLightboxZoom();
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  lightboxDragging = false;
  document.getElementById('lightboxViewport').classList.remove('dragging');
}
const lightboxViewport = document.getElementById('lightboxViewport');
lightboxViewport.addEventListener('wheel', e => {
  e.preventDefault();
  zoomLightbox(e.deltaY < 0 ? 0.2 : -0.2);
});
lightboxViewport.addEventListener('pointerdown', e => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.target !== document.getElementById('lightboxImg')) return;
  lightboxDragging = true;
  lightboxDragStart = { x: e.clientX - lightboxX, y: e.clientY - lightboxY };
  lightboxViewport.classList.add('dragging');
  lightboxViewport.setPointerCapture(e.pointerId);
});
lightboxViewport.addEventListener('pointermove', e => {
  if (!lightboxDragging) return;
  lightboxX = e.clientX - lightboxDragStart.x;
  lightboxY = e.clientY - lightboxDragStart.y;
  applyLightboxTransform();
});
function stopLightboxDrag(e) {
  lightboxDragging = false;
  lightboxViewport.classList.remove('dragging');
  if (e?.pointerId !== undefined) {
    try { lightboxViewport.releasePointerCapture(e.pointerId); } catch (_) {}
  }
}
lightboxViewport.addEventListener('pointerup', stopLightboxDrag);
lightboxViewport.addEventListener('pointercancel', stopLightboxDrag);
document.addEventListener('keydown', e => {
  if (!document.getElementById('authGate').hidden && e.key === 'Enter') {
    e.preventDefault();
    submitAuth();
    return;
  }
  if (e.key === 'Escape') {
    closeLightbox();
    closeBackupModal();
    return;
  }
  const lightboxActive = document.getElementById('lightbox').classList.contains('active');
  if (lightboxActive && (e.key === '+' || e.key === '=')) {
    zoomLightbox(0.25);
  } else if (lightboxActive && e.key === '-') {
    zoomLightbox(-0.25);
  } else if (lightboxActive && e.key === '0') {
    resetLightboxZoom();
  } else if (!lightboxActive && !document.getElementById('backupModal').classList.contains('active') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const target = e.target;
    const isTyping = target && (
      ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) ||
      target.isContentEditable
    );
    if (!isTyping) {
      e.preventDefault();
      navigatePage(e.key === 'ArrowLeft' ? -1 : 1);
    }
  }
});

// --- Auto Refresh ---
async function refreshProgressOnly() {
  await refreshStats();
}

async function refreshAll() {
  await Promise.all([refreshStats(), loadWeibo()]);
}

function startAutoRefresh() {
  refreshAll();
  autoRefreshTimer = setInterval(refreshProgressOnly, 15000); // 15s
}

// --- Init ---
async function init() {
  await loadDates();
  startAutoRefresh();
}
loadAuthStatus();
